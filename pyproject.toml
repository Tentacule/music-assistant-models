[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "music-assistant-models"
version = "1.1.232.dev1"
description = "Music Assistant Base Models (local fork with disc_subtitle)"
requires-python = ">=3.13"
dependencies = [
    "orjson>=3.9",
    "mashumaro>=3.14",
    "anyascii==0.3.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["music_assistant_models*"]
